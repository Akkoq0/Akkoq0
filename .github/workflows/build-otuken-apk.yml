name: Build Ötüken Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'ghostlink/**'
      - 'bulutweb/**'
      - '**.md'

jobs:
  build-otuken-apk:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2-stable"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Accept Licenses & Verify Build-Tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Download Godot 4.7.2 & Export Templates
        run: |
          mkdir -p /tmp/godot "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -sSL -o /tmp/godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot/godot.zip -d /tmp/godot/
          chmod +x /tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64

          curl -sSL -o /tmp/godot/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/godot/templates.tpz -d /tmp/godot/tpl/
          mv /tmp/godot/tpl/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Import Project & Run Test Gate
        run: |
          G=/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64
          $G --headless --import --path .
          $G --headless --path . res://tests/test_suite.tscn

      - name: Generate Debug Keystore & Export APK
        run: |
          mkdir -p build
          keytool -genkey -v -keystore /tmp/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Otuken Debug,O=Otuken,C=TR"
          sed -i 's|keystore/debug=""|keystore/debug="/tmp/debug.keystore"|' export_presets.cfg
          G=/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64
          $G --headless --path . --export-debug "Android" build/otuken.apk

      - name: Upload Ötüken APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Otuken-v0.2.0-debug-apk
          path: build/otuken.apk
          retention-days: 30

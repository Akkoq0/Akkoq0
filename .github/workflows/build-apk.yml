name: Build Meva HUD Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'ghostlink/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'ghostlink/package-lock.json'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        working-directory: ghostlink
        run: npm ci

      - name: Typecheck & Lint
        working-directory: ghostlink
        run: |
          npx tsc --noEmit
          npm run lint

      - name: Build Next.js Static Export
        working-directory: ghostlink
        run: npm run mobile:export

      - name: Sync Capacitor Android
        working-directory: ghostlink
        run: npx cap sync android

      - name: Build Android Debug APK with Gradle
        working-directory: ghostlink/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MevaHUD-v0.1.0-debug.apk
          path: ghostlink/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TimeNest Admin Girişi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style nonce="__CSP_NONCE__">
      :root {
        --bg: #f5f1ea;
        --panel: #fffdfb;
        --primary: #171b22;
        --accent: #b68a52;
        --muted: #5f5a54;
        --border: rgba(17, 24, 39, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, Arial, sans-serif;
        background: linear-gradient(135deg, #f7f3ee 0%, #efe7d7 100%);
        color: var(--primary);
      }

      .login-shell {
        width: min(420px, calc(100% - 28px));
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: 0 24px 50px rgba(17,24,39,0.08);
      }

      .login-body {
        padding: 28px 24px;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-weight: 800;
        font-size: 1.5rem;
        margin-bottom: 12px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: linear-gradient(135deg, #f4e9cf, #d9c5a2);
      }

      .eyebrow {
        text-align: center;
        color: var(--muted);
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        margin-bottom: 20px;
      }

      form {
        display: grid;
        gap: 16px;
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 0.88rem;
        color: var(--muted);
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(17,24,39,0.1);
        background: #faf8f5;
        font: inherit;
      }

      button {
        width: 100%;
        border: none;
        border-radius: 999px;
        padding: 13px 18px;
        background: linear-gradient(135deg, #111827 0%, #1f2937 48%, #b68a52 100%);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      .error {
        min-height: 18px;
        color: #8f3636;
        font-size: 0.88rem;
      }

      .hint {
        margin-top: 6px;
        text-align: center;
        color: var(--muted);
        font-size: 0.8rem;
      }
    </style>
    <link rel="stylesheet" href="styles-redesign.css" />
  </head>
  <body>
    <div class="login-shell">
      <div class="login-body">
        <div class="brand">
          <span class="brand-mark">⌚</span>
          <span>TimeNest</span>
        </div>
        <div class="eyebrow">Yönetim girişi</div>

        <form id="loginForm">
          <label>
            Kullanıcı adı
            <input type="text" name="username" placeholder="admin" required />
          </label>

          <label>
            Şifre
            <input type="password" name="password" placeholder="••••••••" required />
          </label>

          <button type="submit">Giriş yap</button>
          <div id="loginError" class="error"></div>
        </form>

      </div>
    </div>

    <script nonce="__CSP_NONCE__">
      const loginForm = document.getElementById('loginForm');
      const loginError = document.getElementById('loginError');

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        loginError.textContent = '';

        const formData = new FormData(loginForm);
        const payload = {
          username: formData.get('username'),
          password: formData.get('password')
        };

        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const result = await response.json();
          if (!response.ok) {
            loginError.textContent = result.message || 'Giriş başarısız.';
            return;
          }

          window.location.href = '/admin';
        } catch (error) {
          loginError.textContent = 'Sunucuya ulaşılamadı. Lütfen tekrar deneyin.';
        }
      });
    </script>
  </body>
</html>

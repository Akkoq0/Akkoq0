<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14080B" />
      <stop offset="50%" stop-color="#240A10" />
      <stop offset="100%" stop-color="#0B0507" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E84050" />
      <stop offset="50%" stop-color="#C82333" />
      <stop offset="100%" stop-color="#7A121D" />
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#3D121A" stroke-width="8" />

  <!-- Tactical Pentagon Shield Emblem -->
  <polygon points="256,72 432,156 368,396 256,448 144,396 80,156" fill="#180A0E" stroke="#5E1420" stroke-width="12" />

  <!-- Inner Crimson Chevron / Meva Mark -->
  <g filter="url(#crimsonGlow)">
    <polygon points="256,128 376,188 332,364 256,400 180,364 136,188" fill="url(#crimsonGrad)" opacity="0.9" />
    <path d="M192,208 L256,312 L320,208 L348,228 L256,376 L164,228 Z" fill="#FFFFFF" opacity="0.92" />
  </g>

  <!-- Core Tactical Crosshair Rings -->
  <circle cx="256" cy="272" r="32" fill="none" stroke="#FFA3AD" stroke-width="6" opacity="0.85" />
  <circle cx="256" cy="272" r="8" fill="#FFFFFF" />
  <line x1="256" y1="224" x2="256" y2="248" stroke="#FFA3AD" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="296" x2="256" y2="320" stroke="#FFA3AD" stroke-width="6" stroke-linecap="round" />
  <line x1="208" y1="272" x2="232" y2="272" stroke="#FFA3AD" stroke-width="6" stroke-linecap="round" />
  <line x1="280" y1="272" x2="304" y2="272" stroke="#FFA3AD" stroke-width="6" stroke-linecap="round" />
</svg>
